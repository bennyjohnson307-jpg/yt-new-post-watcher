name: New Community Post Watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher
        env:
          CHANNEL_COMMUNITY_URLS: ${{ vars.CHANNEL_COMMUNITY_URLS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python channel_watch.py

      - name: Save state for next run
        run: |
          git config user.name "new-post-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_post.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git pull --rebase -X ours origin main
          git push
